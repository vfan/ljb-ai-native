<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议助手 · 提示词评测台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 18V9m5 9V5m5 13v-6m5 6V7" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>会议助手评测台</strong>
        <small>Prompt Evaluation</small>
      </span>
    </div>

    <nav class="nav" aria-label="主导航">
      <a href="#/run" data-view="run">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 5.5v13l10-6.5-10-6.5Z" stroke-linejoin="round"/></svg>
        运行
      </a>
      <a href="#/compare" data-view="compare">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6" height="16" rx="1.5"/><rect x="14" y="4" width="6" height="16" rx="1.5"/></svg>
        版本对比
      </a>
      <a href="#/dataset" data-view="dataset">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 8 4.5-8 4.5-8-4.5L12 3Z" stroke-linejoin="round"/><path d="m4 12 8 4.5 8-4.5M4 16.5 12 21l8-4.5" stroke-linejoin="round"/></svg>
        测试集
      </a>
      <a href="#/gate" data-view="gate">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.5 19 6v5.5c0 4.2-2.9 7.4-7 9-4.1-1.6-7-4.8-7-9V6l7-2.5Z" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        发布门禁
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="pipeline" aria-label="评分流水线">
        <span>规则</span><i>→</i><span>裁判</span><i>→</i><span>人工</span>
      </div>
      <p>硬性错误单独统计，<br>不让表达分把问题平均掉。</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <p class="eyebrow" id="pageEyebrow">EVALUATION</p>
        <h1 id="pageTitle">运行评测</h1>
        <p class="sub" id="pageSub">固定模型与测试集，对比两个提示词版本。</p>
      </div>
      <div class="topbar-side">
        <span class="chip" id="modeChip">回放</span>
        <span class="model" id="modelName">deepseek-flash</span>
      </div>
    </header>

    <section id="view" class="view" aria-live="polite"></section>
  </main>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-backdrop" data-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-label="样本详情">
    <div id="drawerContent"></div>
  </aside>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
